<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d16">
  <title>Secret Room — Decoder 02</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #edf3ff;
      background: #090d16;
    }
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
      background:
        radial-gradient(ellipse at 50% 20%, rgba(35, 101, 119, .23), transparent 55%),
        linear-gradient(rgba(117, 153, 191, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(117, 153, 191, .035) 1px, transparent 1px),
        #090d16;
      background-size: auto, 36px 36px, 36px 36px, auto;
    }
    .panel {
      width: min(460px, 100%);
      padding: 30px;
      border: 1px solid rgba(98, 239, 255, .2);
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(19, 29, 42, .96), rgba(11, 16, 25, .97));
      box-shadow: 0 25px 90px rgba(0, 0, 0, .45), 0 0 55px rgba(98, 239, 255, .07);
    }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .eyebrow, .status { color: #62efff; font: 10px/1.4 "SFMono-Regular", Consolas, monospace; letter-spacing: .16em; }
    .status { padding: 6px 8px; border: 1px solid rgba(129, 255, 194, .2); border-radius: 999px; color: #81ffc2; background: rgba(129, 255, 194, .05); font-size: 8px; }
    h1 { margin: 27px 0 8px; font-size: clamp(26px, 8vw, 36px); letter-spacing: -.05em; }
    .copy { margin: 0; color: #91a0b6; font-size: 13px; line-height: 1.65; }
    .readout {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin: 27px 0 22px;
      padding: 18px;
      border: 1px solid rgba(98, 239, 255, .17);
      border-radius: 12px;
      background: rgba(4, 9, 15, .55);
    }
    .readout-label { color: #92a0b3; font: 9px/1.5 "SFMono-Regular", Consolas, monospace; letter-spacing: .14em; }
    .digit {
      display: grid;
      width: 58px;
      height: 58px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid rgba(129, 255, 194, .42);
      border-radius: 10px;
      color: #81ffc2;
      background: rgba(129, 255, 194, .08);
      box-shadow: 0 0 25px rgba(129, 255, 194, .1), inset 0 0 16px rgba(129, 255, 194, .07);
      font: 700 30px/1 "SFMono-Regular", Consolas, monospace;
      text-shadow: 0 0 18px rgba(129, 255, 194, .45);
    }
    .instruction { padding-top: 16px; border-top: 1px solid rgba(157, 177, 210, .12); color: #728198; font-size: 11px; line-height: 1.65; }
    code { color: #b7a0ff; font: 10px "SFMono-Regular", Consolas, monospace; }
    @media (max-width: 420px) { .panel { padding: 23px; } .readout { padding: 14px; } }
  </style>
</head>
<body>
  <main class="panel">
    <div class="topline">
      <div class="eyebrow">GIT ESCAPE ROOM / BRANCH 02</div>
      <div class="status">SIGNAL DECODED</div>
    </div>
    <h1>Secret room unlocked.</h1>
    <p class="copy">You followed the branch signal to its source. Record the second digit, then return to the main vault.</p>
    <section class="readout" aria-label="Second vault digit">
      <div class="readout-label">ARCHIVE KEY<br>DIGIT 2 IS: 4</div>
      <div class="digit" aria-hidden="true">4</div>
    </section>
    <div class="instruction">Next step: switch back to <code>main</code> and merge <code>final-clue</code> to complete the circuit.</div>
  </main>
</body>
</html>
